name: Dashboard

# Roda a cada PR e a cada push na main, só quando o dashboard muda
on:
  pull_request:
    paths: ['dashboard/**', '.github/workflows/dashboard.yml']
  push:
    branches: [main]
    paths: ['dashboard/**', '.github/workflows/dashboard.yml']

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dashboard

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      # o tema compilado (genesis.css/.js) precisa bater com a fonte genesisTheme.ts
      - run: npm run tema && git diff --exit-code -- src/shared/design-system/tema
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: qualidade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
